# =====================================================================
# auigetvapeshop.com — .htaccess 补充片段（对应审计报告 3.2 节）
#
# 用途：作为 mu-plugins/au-iget-security-hardening.php 的"服务器层"备份方案。
# 两者可以同时存在（不冲突），但如果发现 PHP 层的安全头因缓存插件/CDN 层被覆盖，
# 可以改用这份 Web 服务器层的规则，确保头信息在响应离开源站前就已经写入。
#
# 部署方式：
#   把下面这段内容【追加】到网站根目录 .htaccess 文件里
#   "# BEGIN WordPress" 那一段的【上方】（即放在最前面），
#   不要替换掉 WordPress 核心自动生成的规则块。
# =====================================================================

<IfModule mod_headers.c>
    # 仅在 HTTPS 下发送 HSTS，避免本地/测试环境（可能走 HTTP）出问题
    <If "%{HTTPS} == 'on'">
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    </If>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"

    # 移除可能泄露服务端信息的响应头（如果 Apache/PHP 配置层未关闭 expose_php）
    Header unset X-Powered-By
    Header always unset X-Pingback
</IfModule>

# ---------------------------------------------------------------------
# 彻底拦截 xmlrpc.php（现状实测该路径返回 Cloudflare 520 异常，需要明确处理）
# 如果业务上确实有插件（如 Jetpack 移动 App 推送）依赖 XML-RPC，请先确认后再启用。
# ---------------------------------------------------------------------
<Files "xmlrpc.php">
    Order Allow,Deny
    Deny from all
</Files>

# ---------------------------------------------------------------------
# 禁止直接访问 wp-content/uploads 目录下的 PHP 文件（防止恶意上传后被直接执行）
# ---------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/wp-content/uploads/.*\.php$ [NC]
    RewriteRule .* - [F,L]
</IfModule>

# ---------------------------------------------------------------------
# 静态资源长缓存（配合审计报告 1.4 节的缓存策略，图片/CSS/JS 已实测为 max-age=31536000，
# 这里补充确保规则在服务器层也生效，避免依赖单一缓存插件配置）
# ---------------------------------------------------------------------
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType font/woff2 "access plus 1 year"
</IfModule>
